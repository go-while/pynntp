# Builds the sdist and wheel for a GitHub release, tests the built wheel with the
# tests from the built sdist, and attaches both files to the release.
# It does not upload to PyPI: the fork has no publishing rights for "pynntp".

name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet build pytest
      - name: Build sdist and wheel
        run: python -m build
      - name: Release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version"
      - name: Test the wheel with the sdist's tests
        run: |
          python -m pip install --quiet dist/*.whl
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist --strip-components=1
          rm -r sdist/nntp  # import the installed wheel, not the source
          cd sdist && PYTHONPATH=. python -m pytest -q -W error::ResourceWarning -p no:cacheprovider tests --ignore=tests/integration
          python -c "import nntp; print(nntp.__file__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
